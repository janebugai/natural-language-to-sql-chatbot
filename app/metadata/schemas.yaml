# Domain registry: maps a domain name to its physical database and its
# business-metadata file. This is the only place a domain gets registered —
# no application or retrieval code should hardcode this mapping.
#
# To add a new domain: add an entry here, create its metadata file (see
# _template.yaml), then run `python -m app.rag.refresh --schema <name>`.

schemas:
  ecommerce:
    description: E-commerce demo store (catalog, orders, fulfillment, reviews, returns).
    backend: duckdb
    database_path: demo.duckdb      # relative to the repo root; built by dbt (see dbt/)
    database_schema: main           # dbt materializes marts into DuckDB's default "main" schema
    metadata_file: metadata/ecommerce.yaml   # relative to app/

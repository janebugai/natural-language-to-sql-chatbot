<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL-to-SQL Chatbot</title>
<style>
  :root {
    color-scheme: light dark;
    /* Zoom palette: brand blue #0B5CFF, near-black #131619, soft greys */
    --paper: #ffffff;
    --paper-2: #f5f7f9;
    --field: #ffffff;
    --ink: #131619;
    --ink-soft: #5c6670;
    --muted: #8a929b;
    --line: #dce0e5;
    --line-strong: #dce0e5;
    --accent: #0b5cff;
    --accent-deep: #0847cc;
    --accent-ink: #0b5cff;
    --accent-soft: #ebf2ff;
    --sky: #0b5cff;
    --error: #e02d3c;
    --serif: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16181a;
      --paper-2: #1f2225;
      --field: #1f2225;
      --ink: #e8eaed;
      --ink-soft: #a8b0b8;
      --muted: #7b838c;
      --line: #33383d;
      --line-strong: #33383d;
      --accent: #4d8bff;
      --accent-deep: #6ba0ff;
      --accent-ink: #0b5cff;
      --accent-soft: #1c2740;
      --sky: #4d8bff;
      --error: #ff6b74;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .app {
    max-width: 92rem;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    border-bottom: 1px solid var(--line);
    background: #3a4a6d;
    color: #ffffff;
    overflow: hidden;
  }
  .hero svg { display: block; width: 100%; height: 46px; }
  .hero .overlay {
    position: absolute;
    inset: 0;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .hero .plate { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.82); }
  .hero h1 {
    font-weight: 700;
    font-size: clamp(1rem, 1.9vw, 1.25rem);
    letter-spacing: -.01em;
    margin: 0;
    color: #ffffff;
  }

  /* ---------- workspace split ---------- */
  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(330px, 30%) 1fr;
    min-height: 0;
  }

  /* ---------- left: chat ---------- */
  .chat {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    min-height: 0;
    background: var(--paper);
  }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 20px 18px; }
  .pane-label { display: block; margin-bottom: 14px; }

  .intro-lead {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 8px 22px;
  }
  .examples .kicker { display: block; margin: 0 8px 10px; }
  .chip {
    display: block; width: 100%; text-align: left;
    background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px;
    font-family: var(--sans); font-size: .9rem; line-height: 1.4; color: var(--ink);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }
  .chip::after { content: " \2192"; color: var(--muted); }

  .turn {
    width: 100%; text-align: left; background: none; border: none;
    border-radius: var(--radius);
    padding: 12px; margin-bottom: 2px; cursor: pointer; display: block;
  }
  .turn:hover { background: var(--paper-2); }
  .turn .q {
    font-family: var(--sans); font-size: .92rem; font-weight: 600; line-height: 1.35;
    color: var(--ink); margin: 5px 0 0;
  }
  .turn .a-line {
    font-size: 12px; line-height: 1.45; color: var(--muted);
    margin: 6px 0 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .turn[aria-current="true"] { background: var(--paper-2); }
  .turn[aria-current="true"] .kicker { color: var(--accent); }
  .turn[aria-current="true"] .q { color: var(--accent-deep); }

  /* ---------- composer ---------- */
  .composer {
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 16px 18px 18px;
  }
  .composer form { display: flex; align-items: flex-end; gap: 10px; }
  #q {
    flex: 1; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--field); color: var(--ink);
    font-family: var(--sans); font-size: .95rem; line-height: 1.4; padding: 11px 14px; resize: none;
  }
  #q::placeholder { color: var(--muted); }
  #q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button.send {
    flex: none; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff;
    font-family: var(--sans); font-size: .9rem; font-weight: 600;
    padding: 11px 20px; cursor: pointer;
  }
  button.send:hover:not(:disabled) { background: var(--accent-deep); }
  button.send:disabled { opacity: .5; cursor: default; }

  /* ---------- right: results ---------- */
  .results { overflow-y: auto; min-height: 0; background: var(--paper); }
  .results-bar {
    position: sticky; top: 0; z-index: 2;
    display: flex; justify-content: flex-end;
    padding: 12px 44px; background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .seg { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg-btn {
    border: none; background: var(--paper); color: #6e6e6e;
    font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 7px 18px; cursor: pointer;
    text-align: center; white-space: nowrap;
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--line); }
  .seg-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg-btn:disabled { cursor: default; }
  .results-inner { max-width: none; padding: 28px 44px 56px; }

  .placeholder .pane-label { margin-bottom: 14px; }
  .schema-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px; margin-top: 12px;
  }
  .schema-grid > div { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; }
  .schema-grid h4 { font-family: var(--sans); font-size: .95rem; font-weight: 700; margin: 0 0 8px; }
  .schema-grid ul { margin: 0; padding: 0; list-style: none; }
  .schema-grid li {
    font-size: 12px; color: var(--ink-soft); padding: 4px 0;
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px;
  }
  .schema-grid li:last-child { border-bottom: none; }
  .schema-grid li span { color: var(--muted); font-family: var(--mono); font-size: 10px; }

  .q-head {
    font-family: var(--sans); font-weight: 700;
    font-size: clamp(1.4rem, 2.6vw, 1.9rem); line-height: 1.25; letter-spacing: -.01em;
    margin: 0;
  }
  .lede { font-size: 1rem; line-height: 1.6; color: var(--ink-soft); margin: 20px 0 26px; }

  .callout {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 20px 22px; margin: 0 0 26px;
  }
  .callout .v {
    font-family: var(--sans); font-weight: 700;
    font-size: clamp(2.1rem, 6vw, 3.3rem); line-height: 1.05; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; color: var(--sky);
  }
  .callout .c { margin-top: 6px; max-width: 44ch; }

  figure.chart { margin: 0 0 26px; }
  figure.chart figcaption {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 30%) 1fr auto; align-items: center; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .bar-row:last-child { border-bottom: none; }
  .bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--sans); color: var(--ink-soft); }
  .bar-track { height: 8px; background: var(--paper-2); border-radius: 999px; }
  .bar-fill { height: 8px; background: var(--sky); border-radius: 999px; }
  .bar-value { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; margin: 0 0 24px; border: 1px solid var(--line); border-radius: var(--radius-lg); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); background: var(--paper-2); }
  td { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  tr:last-child td { border-bottom: none; }

  details { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--paper-2); user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "  \203A"; }
  details[open] summary { border-bottom: 1px solid var(--line); }
  details[open] summary::after { content: "  \2304"; }
  pre.sql { margin: 0; padding: 16px 18px; background: var(--paper-2); color: #828282; overflow-x: auto; font: 12.5px/1.65 var(--mono); }

  .a-error { color: var(--error); font-size: .98rem; }

  .dots span { display: inline-block; width: 5px; height: 5px; margin-right: 5px; border-radius: 999px; background: var(--accent); animation: b 1.1s infinite ease-in-out both; }
  .dots span:nth-child(2) { animation-delay: .18s; }
  .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  @media (max-width: 860px) {
    .app { height: auto; min-height: 100vh; }
    .workspace { grid-template-columns: 1fr; }
    .chat { border-right: none; border-bottom: 1px solid var(--line); max-height: 60vh; }
    .results-inner { padding: 24px 20px 44px; }
    .results-bar { padding: 10px 20px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <svg viewBox="0 0 1600 120" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#43547e"/>
          <stop offset="1" stop-color="#33415f"/>
        </linearGradient>
      </defs>
      <rect width="1600" height="120" fill="url(#g1)"/>
      <g fill="#8a99b8" fill-opacity="0.30">
        <circle cx="1350" cy="26" r="94"/>
        <circle cx="1512" cy="112" r="70"/>
        <circle cx="1236" cy="124" r="48"/>
      </g>
      <g fill="#bcd2ea" fill-opacity="0.16">
        <circle cx="240" cy="120" r="80"/>
        <circle cx="90" cy="14" r="46"/>
      </g>
    </svg>
    <div class="overlay">
      <h1>Ask the database a question.</h1>
      <span class="plate" id="issue-date">&mdash;</span>
    </div>
  </div>

  <div class="workspace">

    <section class="chat">
      <div class="chat-scroll" id="chat-scroll">
        <div id="intro">
          <p class="intro-lead">Pose a question in plain English. It is translated into SQL,
            executed against the demo database, and returned with a summary, a headline figure,
            a chart, and the query &mdash; shown at right.</p>
          <div class="examples">
            <span class="kicker">Start With</span>
            <button class="chip">Which five customers spent the most on completed orders?</button>
            <button class="chip">Total revenue by product category</button>
            <button class="chip">How many orders are there per status?</button>
          </div>
        </div>
        <div id="turns"></div>
      </div>
      <div class="composer">
        <form id="form">
          <textarea id="q" rows="1" placeholder="Type your question" autocomplete="off"></textarea>
          <button class="send" id="send" type="submit">Ask</button>
        </form>
      </div>
    </section>

    <section class="results" id="results">
      <div class="results-bar">
        <div class="seg">
          <button type="button" id="view-result" class="seg-btn" aria-pressed="false" disabled>Result</button>
          <button type="button" id="view-schema" class="seg-btn" aria-pressed="true">Data model</button>
        </div>
      </div>
      <div class="results-inner" id="results-inner"></div>
    </section>

  </div>

</div>

<script>
const chatScroll = document.getElementById('chat-scroll');
const intro = document.getElementById('intro');
const turnsEl = document.getElementById('turns');
const resultsInner = document.getElementById('results-inner');
const results = document.getElementById('results');
const form = document.getElementById('form');
const q = document.getElementById('q');
const send = document.getElementById('send');
const viewResultBtn = document.getElementById('view-result');
const viewSchemaBtn = document.getElementById('view-schema');

document.getElementById('issue-date').textContent = new Date().toLocaleDateString('en-US', {
  year: 'numeric', month: 'long', day: 'numeric',
});

const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
const looksNum = v => typeof v === 'number' || (v != null && v !== '' && !isNaN(Number(v)));
const fmt = v => looksNum(v) ? nf.format(Number(v)) : esc(v);

/* ---------- data model view ---------- */
let schemaHTML = '<p class="kicker">Loading schema&hellip;</p>';
let activeIdx = null;
let view = 'schema';

function renderSchema() {
  view = 'schema';
  viewSchemaBtn.setAttribute('aria-pressed', 'true');
  viewResultBtn.setAttribute('aria-pressed', 'false');
  resultsInner.innerHTML = `<span class="kicker pane-label">The Data Model</span>${schemaHTML}`;
  results.scrollTop = 0;
}
renderSchema();

viewSchemaBtn.addEventListener('click', renderSchema);
viewResultBtn.addEventListener('click', () => { if (activeIdx !== null) selectTurn(activeIdx); });

(async function loadSchema() {
  try {
    const { schema } = await (await fetch('/schema')).json();
    const tables = [];
    schema.split('\n').forEach(line => {
      const m = line.match(/^TABLE (\w+) \((.*)\)$/);
      if (m) tables.push({ name: m[1], cols: m[2].split(', ').map(c => c.split(' ')) });
    });
    schemaHTML = `<div class="schema-grid">${tables.map(t => `
      <div><h4>${esc(t.name)}</h4>
        <ul>${t.cols.map(([n, ty]) => `<li>${esc(n)}<span>${esc(ty || '')}</span></li>`).join('')}</ul>
      </div>`).join('')}</div>`;
  } catch {
    schemaHTML = '<p class="kicker">Schema unavailable</p>';
  }
  if (view === 'schema') renderSchema();
})();

/* ---------- analysis for callout + chart ---------- */
function analyse(rows) {
  if (!rows || !rows.length) return {};
  const cols = Object.keys(rows[0]);
  const numCols = cols.filter(c => rows.every(r => looksNum(r[c])));
  const idish = c => /(^|_)id$/i.test(c);
  const measureish = c => /(total|sum|count|revenue|amount|avg|average|price|spend|spent|qty|quantity|value|share|rate|balance)/i.test(c);
  const valueCol =
    numCols.find(measureish) ||
    numCols.filter(c => !idish(c)).slice(-1)[0] ||
    numCols.slice(-1)[0];
  const labelCol =
    cols.find(c => c !== valueCol && !numCols.includes(c)) ||
    cols.find(c => c !== valueCol);
  return { cols, valueCol, labelCol };
}

function renderCallout(rows, a) {
  if (!a.valueCol) return '';
  if (rows.length === 1) {
    const only = a.cols.length === 1;
    return `<div class="callout"><div class="v">${fmt(rows[0][a.valueCol])}</div>
      <div class="c kicker">${esc(a.valueCol)}${only || !a.labelCol ? '' : ' — ' + esc(rows[0][a.labelCol])}</div></div>`;
  }
  let best = rows[0];
  for (const r of rows) if (Number(r[a.valueCol]) > Number(best[a.valueCol])) best = r;
  return `<div class="callout"><div class="v">${fmt(best[a.valueCol])}</div>
    <div class="c kicker">Highest ${esc(a.valueCol)}${a.labelCol ? ' — ' + esc(best[a.labelCol]) : ''}</div></div>`;
}

function renderChart(rows, a) {
  if (!a.valueCol || !a.labelCol || rows.length < 2) return '';
  const sorted = [...rows].sort((x, y) => Number(y[a.valueCol]) - Number(x[a.valueCol]));
  const shown = sorted.slice(0, 12);
  const max = Math.max(...sorted.map(r => Math.abs(Number(r[a.valueCol])))) || 1;
  const bars = shown.map(r => {
    const v = Number(r[a.valueCol]);
    const pct = Math.max(1.5, Math.abs(v) / max * 100);
    return `<div class="bar-row"><div class="bar-label">${esc(r[a.labelCol])}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-value">${fmt(v)}</div></div>`;
  }).join('');
  const more = sorted.length > shown.length ? ` (top ${shown.length} of ${sorted.length})` : '';
  return `<figure class="chart"><figcaption>${esc(a.valueCol)} by ${esc(a.labelCol)}${more}</figcaption>${bars}</figure>`;
}

function renderTable(rows, a) {
  if (!rows || !rows.length) return '<p class="lede">Query returned no rows.</p>';
  const head = a.cols.map(c => `<th>${esc(c)}</th>`).join('');
  const body = rows.map(r => `<tr>${a.cols.map(c => `<td>${fmt(r[c])}</td>`).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- state ---------- */
const turns = [];  // { question, state:'loading'|'done'|'error', data, error, el }

function selectTurn(i) {
  activeIdx = i;
  view = 'result';
  viewResultBtn.disabled = false;
  viewResultBtn.setAttribute('aria-pressed', 'true');
  viewSchemaBtn.setAttribute('aria-pressed', 'false');
  turns.forEach((t, j) => t.el.setAttribute('aria-current', String(j === i)));
  const t = turns[i];
  results.scrollTop = 0;
  if (t.state === 'loading') {
    resultsInner.innerHTML = `<p class="q-head">${esc(t.question)}</p>
      <p class="lede"><span class="dots"><span></span><span></span><span></span></span></p>`;
    return;
  }
  if (t.state === 'error') {
    resultsInner.innerHTML = `<p class="q-head">${esc(t.question)}</p>
      <p class="a-error">${esc(t.error)}</p>`;
    return;
  }
  const d = t.data, a = analyse(d.rows);
  resultsInner.innerHTML = `<p class="q-head">${esc(d.question)}</p>
    ${d.summary ? `<p class="lede">${esc(d.summary)}</p>` : ''}
    ${renderCallout(d.rows, a)}
    ${renderChart(d.rows, a)}
    ${renderTable(d.rows, a)}
    <p class="kicker">${d.row_count} row${d.row_count === 1 ? '' : 's'} returned</p>
    <details><summary>Show SQL</summary><pre class="sql">${esc(d.sql)}</pre></details>`;
}

function addTurn(question) {
  intro.hidden = true;
  const el = document.createElement('button');
  el.className = 'turn';
  el.type = 'button';
  const idx = turns.length;
  el.innerHTML = `<span class="kicker">Query ${String(idx + 1).padStart(2, '0')}</span>
    <p class="q">${esc(question)}</p>
    <p class="a-line">Running&hellip;</p>`;
  el.addEventListener('click', () => selectTurn(idx));
  turnsEl.appendChild(el);
  const t = { question, state: 'loading', el };
  turns.push(t);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  selectTurn(idx);
  return t;
}

async function ask(text) {
  const t = addTurn(text);
  send.disabled = true;
  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, include_summary: true }),
    });
    const data = await res.json();
    if (!res.ok) {
      t.state = 'error';
      t.error = data.detail || `Request failed (${res.status})`;
      t.el.querySelector('.a-line').textContent = t.error;
    } else {
      t.state = 'done';
      t.data = data;
      t.el.querySelector('.a-line').textContent = data.summary || `${data.row_count} rows returned`;
    }
  } catch (e) {
    t.state = 'error';
    t.error = 'Could not reach the server: ' + e.message;
    t.el.querySelector('.a-line').textContent = t.error;
  } finally {
    send.disabled = false;
    if (turns[turns.length - 1] === t) selectTurn(turns.length - 1);
    q.focus();
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = '';
  q.style.height = 'auto';
  ask(text);
});
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => ask(c.textContent.replace(/\s*→$/, '').trim()));
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
q.addEventListener('input', () => {
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 130) + 'px';
});
q.focus();
</script>
